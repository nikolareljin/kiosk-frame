name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  ci:
    uses: nikolareljin/ci-helpers/.github/workflows/python.yml@production
    with:
      python_version: "3.11"
      lint_command: "python -m compileall -q . && ./scripts/lint-shell.sh"
      test_command: ""
      build_command: ""
